version: "3"
services:
  # eureka, api-gateway는 blue-blue 전략을 사용하지 않는다.
  eureka-server:
    build:
      context: ./back/eureka
      dockerfile: Dockerfile
    container_name: eureka-server
    ports:
      - "8762:8761"
    networks:
      - maonnet
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888

  api-gateway:
    build:
      context: ./back/gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8766:8765"
    depends_on:
      - eureka-server
    networks:
      - maonnet
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888

  # member / blue, blue
  member-green:
    build:
      context: ./back/member
      dockerfile: Dockerfile
    container_name: member-green
    ports:
      - "18011:8080"
    networks:
      - maonnet
    depends_on:
      - eureka-server
      - api-gateway
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_PROFILES_COLOR=blue

  tournament-green:
    build:
      context: ./back/route
      dockerfile: Dockerfile
    container_name: tournament-green
    ports:
      - "18021:8080"
    networks:
      - maonnet
    depends_on:
      - eureka-server
      - api-gateway
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_PROFILES_COLOR=blue

  route-green:
    build:
      context: ./back/route
      dockerfile: Dockerfile
    container_name: route-green
    ports:
      - "18031:8080"
    networks:
      - maonnet
    depends_on:
      - eureka-server
      - api-gateway
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - SPRING_PROFILES_COLOR=blue

networks:
  maonnet:
    external: true